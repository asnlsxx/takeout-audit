name: Prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing audit prerelease tag, for example audit-v0.1.0-alpha.1'
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate prerelease tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^audit-v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]'
      - name: Require successful CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA=$(git rev-parse HEAD)
          gh run list --workflow ci.yml --commit "$SHA" --event push --limit 20 \
            --json status,conclusion | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")'
      - run: go test ./...
      - name: Build dedicated binaries
        env:
          TAG: ${{ inputs.tag }}
          CGO_ENABLED: '0'
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            OS=${target%/*}; ARCH=${target#*/}; EXT=""
            [ "$OS" = windows ] && EXT=".exe"
            NAME="takeout-audit_${OS}_${ARCH}"
            mkdir -p "dist/$NAME"
            GOOS=$OS GOARCH=$ARCH go build -trimpath -ldflags "-s -w -X main.version=$TAG -X main.commit=$SHA -X main.date=$DATE" -o "dist/$NAME/takeout-audit$EXT" ./cmd/takeout-audit
            cp LICENSE config.example.yaml "dist/$NAME/"
            cp docs/quickstart.md "dist/$NAME/README.md"
            cp START-HERE.zh-CN.md "dist/$NAME/"
            (cd "dist/$NAME" && zip -q "../$NAME.zip" *)
          done
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: true
          make_latest: false
          body_path: docs/release-notes.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
