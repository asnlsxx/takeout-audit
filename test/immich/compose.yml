# Disposable CI fixture, derived from Immich v3.2.0's official compose file.
# No ML container/models. Ports bind loopback only. Never use production volumes.
name: takeout-audit-ci
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.0
    ports: ['127.0.0.1:2283:2283']
    env_file: .env
    environment:
      IMMICH_CONFIG_FILE: /config/config.json
    volumes:
      - uploads:/data
      - ./config.json:/config/config.json:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
  redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes: [database:/var/lib/postgresql/data]
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d immich']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  uploads:
  database:
